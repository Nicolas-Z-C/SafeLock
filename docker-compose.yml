services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql

  webapi:
    build:
      context: .
      dockerfile: src/Safelock.Web/Safelock.WebApi/Dockerfile
    env_file: .env
    depends_on:
      - db
    ports:
      - "8080:8080"

  webassembly:
    build:
      context: .
      dockerfile: src/Safelock.Web/Safelock.WebAssembly/Dockerfile
    depends_on:
      - webapi
    ports:
      - "5000:80"

volumes:
  mssqldata: